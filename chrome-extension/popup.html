<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SiteStripe Deal Extractor</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .header img {
      width: 24px;
      height: 24px;
    }

    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .preview-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 4px;
      background: #fff;
    }

    .preview-info {
      flex: 1;
      overflow: hidden;
    }

    .preview-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .preview-price {
      color: var(--success);
      font-weight: 700;
      font-size: 13px;
    }

    .btn {
      width: 100%;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    #status.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    #status.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>🛍️ SiteStripe to Google Sheet</h2>
  </div>

  <div class="form-group">
    <label for="url">Amazon / SiteStripe URL</label>
    <input type="text" id="url" placeholder="https://amzn.to/... or https://amazon.in/dp/..." />
  </div>

  <div class="form-group">
    <label for="title">Title (Auto-extracted if blank)</label>
    <input type="text" id="title" placeholder="Product Title..." />
  </div>

  <div class="form-group">
    <label for="price">Price (₹)</label>
    <input type="text" id="price" placeholder="e.g. 999" />
  </div>

  <div class="form-group">
    <label for="image">Image URL</label>
    <input type="text" id="image" placeholder="https://images-na.ssl-images-amazon.com/..." />
  </div>

  <div id="previewCard" class="preview-card" style="display: none;">
    <img id="previewImg" class="preview-img" src="" alt="Preview" />
    <div class="preview-info">
      <div id="previewTitle" class="preview-title"></div>
      <div id="previewPrice" class="preview-price"></div>
    </div>
  </div>

  <button id="saveBtn" class="btn">🚀 Save to Google Sheet</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
